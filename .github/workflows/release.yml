name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.26"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install libvirt-dev
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev pkg-config gcc

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/vtui" \
            ./cmd/tui/

      - uses: actions/upload-artifact@v4
        with:
          name: vtui-linux-amd64
          path: dist/vtui

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
